<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #ced4da; stroke-width: 2; rx: 8; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #212529; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #adb5bd; stroke-width: 2; fill: none; }
      .arrow-head { fill: #adb5bd; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
    </marker>
  </defs>

  <rect x="0" y="0" width="400" height="600" fill="#ffffff" rx="12"/>

  <!-- Nodes -->
  <g transform="translate(200, 50)">
    <rect x="-80" y="-20" width="160" height="40" class="box" />
    <text x="0" y="0" class="text">Text Input</text>
  </g>

  <g transform="translate(200, 130)">
    <rect x="-80" y="-20" width="160" height="40" class="box" />
    <text x="0" y="0" class="text">Tokenizer</text>
  </g>

  <g transform="translate(200, 210)">
    <rect x="-80" y="-20" width="160" height="40" class="box" style="fill: #e3f2fd; stroke: #90caf9;" />
    <text x="0" y="0" class="text">MentalBERT</text>
  </g>

  <g transform="translate(200, 290)">
    <rect x="-80" y="-20" width="160" height="40" class="box" />
    <text x="0" y="0" class="text">[CLS] Token</text>
  </g>

  <g transform="translate(200, 370)">
    <rect x="-80" y="-20" width="160" height="40" class="box" />
    <text x="0" y="0" class="text">Linear Layer</text>
  </g>

  <g transform="translate(200, 450)">
    <rect x="-80" y="-20" width="160" height="40" class="box" />
    <text x="0" y="0" class="text">Softmax</text>
  </g>

  <g transform="translate(200, 530)">
    <rect x="-100" y="-20" width="200" height="40" class="box" style="fill: #e8f5e9; stroke: #a5d6a7;" />
    <text x="0" y="0" class="text">Mental Health Label</text>
  </g>

  <!-- Arrows -->
  <line x1="200" y1="70" x2="200" y2="100" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="150" x2="200" y2="180" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="230" x2="200" y2="260" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="310" x2="200" y2="340" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="390" x2="200" y2="420" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="470" x2="200" y2="500" class="arrow" marker-end="url(#arrowhead)"/>
</svg>
